<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NW TEKKEN BRACKETS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0e0e0e;--panel2:#1c1c1c;--text:#fff;--muted:#9a9a9a;--red:#fff;--gold:#fff;--line:#333;--win:#fff;--winl:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--panel:#f4f4f4;--panel2:#e6e6e6;--text:#000;--muted:#666;--red:#000;--gold:#000;--line:#ccc;--win:#000;--winl:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#fff;--panel:#f4f4f4;--panel2:#e6e6e6;--text:#000;--muted:#666;--red:#000;--gold:#000;--line:#ccc;--win:#000;--winl:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh}
.logo{font-family:'Rajdhani',Impact,sans-serif;font-weight:700;letter-spacing:.06em;direction:ltr;text-align:center;padding:14px 0 10px;border-bottom:3px solid var(--red);background:var(--panel)}
.logo b{font-size:26px;color:var(--text)}.logo b i{font-style:normal;color:var(--red)}
.logo span{display:block;font-size:13px;color:var(--gold);letter-spacing:.3em}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:16px 'Tajawal',sans-serif}
.add{display:flex;gap:8px}.add input{flex:1}
button{font:700 15px 'Tajawal',sans-serif;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;background:var(--panel2);color:var(--text)}
button.p{background:var(--red);color:var(--bg)}
button:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:6px;padding:6px 10px;font-weight:700}
.chip button{padding:0 4px;background:none;color:var(--red);font-size:18px}
.opts{display:flex;gap:10px}.opts>div{flex:1}
.full{width:100%;font-size:17px;padding:14px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar h2{flex:1;margin:0;font-size:18px}
.bar button{padding:8px 12px;font-size:13px}
.champ{text-align:center;background:linear-gradient(var(--panel),var(--panel2));border:2px solid var(--gold);border-radius:10px;padding:16px;margin-bottom:12px}
.champ .n{font-family:'Rajdhani','Tajawal',sans-serif;font-size:34px;font-weight:700;color:var(--gold)}
.scroll{overflow-x:auto;direction:ltr;padding-bottom:14px}
.cols{display:flex;gap:18px;min-width:min-content}
.col{width:190px;flex:none;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.col h3{margin:0 0 4px;font-size:13px;color:var(--gold);text-align:center;direction:rtl}
.m{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.m.ready{border-left-color:var(--red)}.m.done{cursor:pointer;border-left-color:var(--red)}
.m.bye{opacity:.55;cursor:default}
.pl{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;font-weight:700;font-size:14px;direction:rtl}
.pl+.pl{border-top:1px solid var(--line)}
.pl.w{background:var(--win);color:var(--winl)}.pl.l{color:var(--muted)}
.pl.t{color:var(--muted);font-weight:400}
.pl em{font-style:normal;font-family:'Rajdhani',sans-serif;font-size:17px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.box{background:var(--panel);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--red)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
.sr .nm{font-weight:900;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:10px}
.st button{width:44px;height:44px;padding:0;font-size:22px}
.st b{font-family:'Rajdhani',sans-serif;font-size:30px;width:34px;text-align:center}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:6px 0 12px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--red);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.sec{margin:20px 0 8px;font-size:15px;font-weight:900;color:var(--red);border-right:4px solid var(--red);padding-right:8px}.m.dead{visibility:hidden}.zm{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:8px}.zm button{padding:8px 14px}.zm b{min-width:52px;text-align:center;font-family:'Rajdhani',sans-serif;font-size:18px}.pl small,.sr small{display:block;font-weight:400;font-size:11px;color:var(--muted)}.pl.w small{color:inherit;opacity:.7}.logo img{display:block;height:88px;max-width:80%;object-fit:contain;margin:0 auto 4px}:root[data-theme="light"] .logo img{filter:invert(1)}@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .logo img{filter:invert(1)}}.tools{display:flex;gap:6px;justify-content:center;margin-top:8px}.tools button{padding:5px 10px;font-size:12px}.btn{font:700 12px 'Tajawal',sans-serif;border-radius:8px;padding:5px 10px;background:var(--panel2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center}
</style>
</head>

<script>
const KEY='nw_tekken_brackets_v1';
let S={stage:'setup',name:'',bo:3,shuffle:true,mode:'single',players:[],cols:[]};
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.stage){S=Object.assign(S,d);if(S.stage==='bracket'&&!S.cols.length)S.stage='setup'}}}catch(e){}
let M=null;S.players=(S.players||[]).map(p=>typeof p==='string'?{n:p,c:'',r:''}:p);S.zoom=S.zoom||1;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
const need=()=>Math.ceil(S.bo/2);
const P=v=>v!==null&&v>=0;
const CH=['Jin','Kazuya','Paul','Law','King','Jun','Asuka','Lili','Nina','Jack-8','Bryan','Lars','Alisa','Hwoarang','Devil Jin','Xiaoyu','Reina','Raven','Leroy','Claudio','Azucena','Victor','Zafina','Leo','Steve','Shaheen','Feng','Lidia','Panda','Kuma','Dragunov','Yoshimitsu','Clive','Eddy','Anna','Heihachi','Lee','Fahkumram','Armor King'];
const RK=['Beginner','Fighter','Strategist','Combatant','Brawler','Ranger','Cavalry','Warrior','Assailant','Dominator','Vanquisher','Destroyer','Savior','Overlord','Genbu','Byakko','Seiryu','Suzaku','Mighty Ruler','Revered Ruler','Divine Ruler','Eternal Ruler','Fujin','Raijin','Kishin','Bushin','Tekken King','Tekken Emperor','Tekken God','Tekken God Supreme','God of Destruction'];
const nm=p=>p===-1?'BYE':P(p)?esc(S.players[p].n):'—';
const sub=p=>{const q=P(p)?S.players[p]:null;return q&&(q.c||q.r)?`<small>${esc(q.c)}${q.c&&q.r?' · ':''}${esc(q.r)}</small>`:''};
const zset=z=>{S.zoom=Math.max(.3,Math.min(1.6,Math.round(z*10)/10));document.querySelectorAll('.cols').forEach(e=>e.style.zoom=S.zoom);$('zv').textContent=Math.round(S.zoom*100)+'%';save()};

function seedOrder(n){let o=[1];while(o.length<n){const k=o.length*2;o=o.flatMap(x=>[x,k+1-x])}return o}
// W = فائزين، L = خاسرين، G = النهائي الكبير. -1 = لا يوجد لاعب (BYE)
function build(){
 const n=S.players.length;let size=2;while(size<n)size*=2;
 const k=Math.log2(size);S.k=k;S.dbl=S.mode==='double'&&size>=4;
 const slots=seedOrder(size).map(s=>s<=n?s-1:-1);
 const mk=()=>({a:null,b:null,sa:0,sb:0,w:null});
 const cols=[];
 for(let r=0;r<k;r++)cols.push({br:'W',r,ms:Array.from({length:size>>(r+1)},mk)});
 if(S.dbl){
  for(let l=0;l<2*(k-1);l++)cols.push({br:'L',r:l,ms:Array.from({length:size>>((l>>1)+2)},mk)});
  cols.push({br:'G',r:0,ms:[mk()]});
 }
 S.cols=cols;
 cols[0].ms.forEach((m,j)=>{m.a=slots[2*j];m.b=slots[2*j+1]});
 settle();
}
function wt(ci,i){const c=S.cols[ci];
 if(c.br==='W')return c.r<S.k-1?[ci+1,i>>1,i&1]:(S.dbl?[S.cols.length-1,0,0]:null);
 if(c.br==='L'){if(c.r===2*(S.k-1)-1)return[S.cols.length-1,0,1];return c.r%2===0?[ci+1,i,0]:[ci+1,i>>1,i&1]}
 return null}
function lt(ci,i){const c=S.cols[ci];if(!S.dbl||c.br!=='W')return null;
 return c.r===0?[S.k,i>>1,i&1]:[S.k+2*c.r-1,i,1]}
function put(t,v){if(t)S.cols[t[0]].ms[t[1]][t[2]?'b':'a']=v}
function resolve(ci,i,win,bye,lo){const m=S.cols[ci].ms[i];m.w=win;if(bye)m.bye=true;put(wt(ci,i),win);put(lt(ci,i),lo)}
function settle(){let ch=true;while(ch){ch=false;S.cols.forEach((c,ci)=>c.ms.forEach((m,i)=>{
 if(m.w!==null)return;const A=m.a,B=m.b;
 if(A===-1&&B===-1){resolve(ci,i,-1,true,-1);ch=true}
 else if((A===-1&&P(B))||(B===-1&&P(A))){resolve(ci,i,A===-1?B:A,true,-1);ch=true}
}))}}
function champion(){const c=S.cols[S.cols.length-1];const w=c&&c.ms[0].w;return P(w)?S.players[w].n:null}
function cname(c){const k=S.k;
 if(c.br==='G')return 'النهائي الكبير';
 if(c.br==='W'){const t=k-c.r;return t===1?(S.dbl?'نهائي الفائزين':'النهائي'):t===2?'نصف النهائي':t===3?'ربع النهائي':'دور الـ'+(1<<t)}
 const last=2*(k-1)-1;return c.r===last?'نهائي الخاسرين':c.r===last-1?'نصف نهائي الخاسرين':'خاسرين - دور '+(c.r+1)}

function ask(t,fn){
 $('box').innerHTML=`<div class="hint" style="font-size:16px;color:var(--text)">${t}</div><div style="display:flex;gap:8px"><button id="no" style="flex:1">إلغاء</button><button class="p" id="yes" style="flex:1">تأكيد</button></div>`;
 $('sheet').classList.add('on');$('no').onclick=close;$('yes').onclick=()=>{close();fn()}}

function setup(){
 $('app').innerHTML=`<div class="card"><label>اسم البطولة</label><input id="tn" value="${esc(S.name)}" placeholder="مثال: بطولة NW الأسبوعية" maxlength="40"></div>
 <div class="card"><label>نظام البطولة</label><select id="md"><option value="single">إقصاء فردي (خسارة وتطلع)</option><option value="double">إقصاء مزدوج (فائزين + خاسرين + نهائي كبير)</option></select></div>
 <div class="card"><label>أضف اللاعبين (${S.players.length})</label>
 <input id="pn" placeholder="اسم اللاعب" maxlength="20"><div class="opts" style="margin-top:8px"><div><input id="pc" list="chars" placeholder="الشخصية (اختياري)" maxlength="24"></div><div><input id="pr" list="ranks" placeholder="الرانك (اختياري)" maxlength="24"></div></div><button class="p full" id="pa" style="margin-top:8px">إضافة اللاعب</button><datalist id="chars">${CH.map(x=>`<option value="${x}">`).join('')}</datalist><datalist id="ranks">${RK.map(x=>`<option value="${x}">`).join('')}</datalist>
 <div class="chips">${S.players.map((p,i)=>`<div class="chip">${esc(p.n)}${p.c?' · '+esc(p.c):''}<button data-d="${i}" aria-label="حذف">×</button></div>`).join('')}</div></div>
 <div class="card opts"><div><label>نظام المباراة</label><select id="bo"><option value="1">فوز واحد (Bo1)</option><option value="3">أفضل من 3</option><option value="5">أفضل من 5</option><option value="7">أفضل من 7</option></select></div>
 <div><label>ترتيب اللاعبين</label><select id="sh"><option value="1">عشوائي</option><option value="0">حسب الإدخال</option></select></div></div>
 <button class="p full" id="go" ${S.players.length<2?'disabled':''}>ابدأ البطولة (${S.players.length} لاعب)</button>`;
 $('bo').value=S.bo;$('sh').value=S.shuffle?1:0;$('md').value=S.mode;
 const add=()=>{const v=$('pn').value.trim();if(!v)return;
  if(S.players.some(p=>p.n.toLowerCase()===v.toLowerCase()))return toast('الاسم مكرر');
  if(S.players.length>=64)return toast('الحد الأقصى 64 لاعب');
  S.name=$('tn').value;S.players.push({n:v,c:$('pc').value.trim(),r:$('pr').value.trim()});save();setup();$('pn').focus()};
 $('pa').onclick=add;$('pn').onkeydown=e=>{if(e.key==='Enter')add()};
 $('tn').oninput=e=>{S.name=e.target.value;save()};
 $('md').onchange=e=>{S.mode=e.target.value;save()};
 $('bo').onchange=e=>{S.bo=+e.target.value;save()};
 $('sh').onchange=e=>{S.shuffle=e.target.value==='1';save()};
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.players.splice(+b.dataset.d,1);save();setup()});
 $('go').onclick=()=>{
  S.name=$('tn').value.trim()||'بطولة NW';
  if(S.mode==='double'&&S.players.length<3){S.mode='single';toast('الإقصاء المزدوج يحتاج 3 لاعبين على الأقل، تحوّلت لإقصاء فردي')}
  if(S.shuffle)for(let i=S.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.players[i],S.players[j]]=[S.players[j],S.players[i]]}
  build();S.stage='bracket';save();view()};
}

function card(ci,i){
 const m=S.cols[ci].ms[i],ready=P(m.a)&&P(m.b)&&!m.bye;
 const cls='m'+(m.bye?' bye':m.w!==null?' done':ready?' ready':'')+(m.a===-1&&m.b===-1?' dead':'');
 const row=p=>`<div class="pl ${m.w===null?(P(p)?'':'t'):(m.w===p?'w':'l')}"><span>${nm(p)}${sub(p)}</span><em>${ready&&m.w!==null?(p===m.a?m.sa:m.sb):''}</em></div>`;
 return `<div class="${cls}" ${ready?`data-c="${ci}" data-i="${i}"`:''}>${row(m.a)}${row(m.b)}</div>`}
function sec(t,br){
 const cs=S.cols.map((c,ci)=>[c,ci]).filter(x=>x[0].br===br);if(!cs.length)return'';
 return `<h4 class="sec">${t}</h4><div class="scroll"><div class="cols">${cs.map(([c,ci])=>`<div class="col"><h3>${cname(c)}</h3>${c.ms.map((_,i)=>card(ci,i)).join('')}</div>`).join('')}</div></div>`}

function view(){
 if(S.stage==='setup')return setup();
 const c=champion();
 $('app').innerHTML=`<div class="bar"><h2>${esc(S.name)}</h2><button id="rs">إعادة النتائج</button><button id="nw">بطولة جديدة</button></div><div class="zm"><button id="zo" aria-label="تصغير">−</button><b id="zv">100%</b><button id="zi" aria-label="تكبير">+</button><button id="zr">ملاءمة الشاشة</button></div>
 ${c?`<div class="champ">🏆<div class="n">${esc(c)}</div><div>بطل ${esc(S.name)}</div></div>`:'<div class="hint">اضغط على أي مباراة جاهزة لتسجيل النتيجة · '+(S.bo===1?'فوز واحد':'أفضل من '+S.bo)+'</div>'}
 ${sec(S.dbl?'قسم الفائزين':'البراكت','W')}${sec('قسم الخاسرين','L')}${sec('النهائي الكبير','G')}`;
 document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>open(+e.dataset.c,+e.dataset.i));
 $('zo').onclick=()=>zset(S.zoom-.1);$('zi').onclick=()=>zset(S.zoom+.1);
 $('zr').onclick=()=>{const cs=document.querySelectorAll('.cols');cs.forEach(e=>e.style.zoom=1);let w=0;cs.forEach(e=>w=Math.max(w,e.scrollWidth));zset(Math.min(1,$('app').clientWidth/w))};
 zset(S.zoom);
 $('rs').onclick=()=>ask('تمسح كل النتائج وتبدأ من الأول بنفس اللاعبين والترتيب؟',()=>{build();save();view()});
 $('nw').onclick=()=>ask('تبدأ بطولة جديدة؟ البطولة الحالية بتنمسح.',()=>{S={stage:'setup',name:'',bo:S.bo,shuffle:S.shuffle,mode:S.mode,players:[],cols:[]};save();view()});
}

function open(c,i){const m=S.cols[c].ms[i];M={c,i,sa:m.sa,sb:m.sb};sheet()}
function sheet(){
 const col=S.cols[M.c],m=col.ms[M.i],n=need();
 const ok=(M.sa===n&&M.sb<n)||(M.sb===n&&M.sa<n);
 const row=(k,p)=>`<div class="sr"><div class="nm">${nm(p)}${sub(p)}</div><div class="st"><button data-k="${k}" data-v="-1">−</button><b>${M[k]}</b><button data-k="${k}" data-v="1">+</button></div></div>`;
 $('box').innerHTML=`<div class="hint" style="margin-top:0">${cname(col)} · الفوز عند ${n}</div>${row('sa',m.a)}${row('sb',m.b)}
 <div style="display:flex;gap:8px;margin-top:10px"><button id="cx" style="flex:1">إلغاء</button><button class="p" id="sv" style="flex:2" ${ok?'':'disabled'}>حفظ النتيجة</button></div>`;
 $('sheet').classList.add('on');
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{M[b.dataset.k]=Math.max(0,Math.min(n,M[b.dataset.k]+ +b.dataset.v));sheet()});
 $('cx').onclick=close;
 $('sv').onclick=()=>{
  const win=M.sa>M.sb?m.a:m.b,lo=win===m.a?m.b:m.a;
  const tg=[wt(M.c,M.i),lt(M.c,M.i)].filter(Boolean);
  if(m.w!==null&&m.w!==win&&tg.some(t=>S.cols[t[0]].ms[t[1]].w!==null))return toast('المباراة التالية انلعبت، ما تقدر تغيّر الفائز');
  m.sa=M.sa;m.sb=M.sb;
  if(m.w!==win){m.w=win;put(wt(M.c,M.i),win);put(lt(M.c,M.i),lo);settle()}
  save();close();view();
  if(champion())toast('🏆 مبروك البطل!')};
}
function close(){$('sheet').classList.remove('on');M=null}
$('sheet').onclick=e=>{if(e.target.id==='sheet')close()};
const TK='nw_tekken_theme';
const setTheme=t=>{document.documentElement.dataset.theme=t};
$('th').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');const n=cur==='dark'?'light':'dark';setTheme(n);try{localStorage.setItem(TK,n)}catch(e){}};
try{const t=localStorage.getItem(TK);if(t)setTheme(t)}catch(e){}
view();
</script>
</body>
</html>
